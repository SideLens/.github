name: 功能建议
description: 提出一个新功能或改进
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提之前建议先看 [docs/blockers.md](https://github.com/SideLens/sidelens/blob/master/docs/blockers.md)，
        有些方向已经验证过走不通，文档里写了原因。

  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 描述场景，而不是直接说方案
      placeholder: 跨设备时画面偶尔会卡一下，想知道是不是时钟同步的问题
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
      description: 可选。如果有具体的实现思路请写在这里
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 协议 / 传输（sidelens-proto / transport）
        - 核心算法（抖动缓冲 / NACK / FEC / 拥塞控制）
        - 编解码（H.264 / Opus）
        - 采集（DXGI / GDI / WASAPI）
        - 渲染（D3D11 / GDI）
        - 界面（Win32 UI）
        - 虚拟摄像头
        - 文档 / 工具链
        - 其他
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过其他方案吗
      description: 为什么现有的做法不够
    validations:
      required: false
